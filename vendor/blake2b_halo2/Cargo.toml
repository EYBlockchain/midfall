[package]
name = "blake2b_halo2"
version = "0.1.0"
edition = "2021"
description = """
Midnight-proofs circuit for Blake2b
"""
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
ff = "0.13"
midnight-curves = "0.2.0"
midnight-proofs = { version = "0.7.0", default-features = false, features = [
  "circuit-params",
  "committed-instances",
] }
blake2b_simd = "1"

rand = "0.8"
hex = "0.4.3"
num-bigint = "0.4"

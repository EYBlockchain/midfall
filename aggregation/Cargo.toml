[package]
name = "midnight-aggregation"
version = "0.1.2"
edition = "2021"
rust-version = "1.76.0"
description = "Toolkit for proof aggregation of midnight-proofs"
license = "MIT OR Apache-2.0"
categories = ["cryptography"]
keywords = ["halo", "proofs", "zkp", "zkSNARKs", "aggregation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[dependencies]
group = { workspace = true }
ff = { workspace = true }
midnight-curves = "0.2.0"
midnight-proofs = { version = "0.7.0", default-features = false, features = [
    "circuit-params",
    "committed-instances",
] }
midnight-circuits = { version = "6.0.0", default-features = false, features = [
    "testing",
] }
midnight-zk-stdlib = { path = "../zk_stdlib", version = "1.0.0" }

rand = { workspace = true }
blake2b_simd = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true, optional = true }

[dev-dependencies]
rand_chacha = { workspace = true }

[[example]]
name = "ivc"
required-features = ["truncated-challenges"]

[[example]]
name = "single_circuit_aggregation"
required-features = ["truncated-challenges"]

[features]
truncated-challenges = [
    "midnight-proofs/truncated-challenges",
    "midnight-circuits/truncated-challenges",
]
single-h-commitment = [
    "midnight-proofs/single-h-commitment",
    "midnight-circuits/single-h-commitment",
    "midnight-zk-stdlib/single-h-commitment",
]
proof-fewer-point-sets = ["midnight-proofs/fewer-point-sets"]
in-circuit-fewer-point-sets = [
    "midnight-proofs/fewer-point-sets",
    "midnight-circuits/in-circuit-fewer-point-sets",
]
fewer-point-sets = [
    "proof-fewer-point-sets",
    "midnight-circuits/fewer-point-sets",
]
# Enables `IvcProver::prove_final_step` / `IvcVerifier::verify_final`,
# which produce / consume the LAST IVC chain proof under a Keccak
# transcript instead of Poseidon. Used when the final proof needs to
# be verified by an EVM Solidity contract (Solidity Keccak is cheap;
# Poseidon is not).
keccak-transcript = [
    "dep:sha3",
    "midnight-proofs/keccak-transcript",
]

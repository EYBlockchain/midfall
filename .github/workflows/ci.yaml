name: CI checks

on:
  pull_request:
  push:
    branches:
      - main
      - next

jobs:
  download-srs:
    runs-on: ubuntu-latest
    outputs:
      srs-cache-hit: ${{ steps.cache-srs.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Restore SRS from cache
        id: restore-srs
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - name: Download SRS if not cached
        if: steps.restore-srs.outputs.cache-hit != 'true'
        run: |
          mkdir -p zk_stdlib/examples/assets
          curl -L -o zk_stdlib/examples/assets/bls_filecoin_2p19 \
            https://midnight-s3-fileshare-dev-eu-west-1.s3.eu-west-1.amazonaws.com/bls_filecoin_2p19

  test-blstrs:
    if: github.event.pull_request.draft == false
    name: Test blstrs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-curves
          args: --release --all-features

  test-circuits:
    if: github.event.pull_request.draft == false
    name: Test circuits
    runs-on: ubuntu-latest-16-core-x64

    env:
      RUST_BACKTRACE: full
      RUSTFLAGS: --cfg ci_build

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: cargo tree -e features -p midnight-curves
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-circuits
          args: --release

  test-zk-stdlib:
    needs: download-srs
    if: github.event.pull_request.draft == false
    name: Test zk-stdlib
    runs-on: ubuntu-latest-16-core-x64

    env:
      RUST_BACKTRACE: full
      RUSTFLAGS: --cfg ci_build

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Restore SRS from cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zk-stdlib
          args: --release -- --skip serialization
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zk-stdlib
          args: --release --test serialization -- --test-threads=1

  test-vk-consistency:
    needs: download-srs
    if: github.event.pull_request.draft == false
    name: Test VK consistency
    runs-on: ubuntu-latest-16-core-x64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Restore SRS from cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zk-stdlib
          args: --release -- --ignored

      - name: Check for changes in goldenfiles/examples.
        run: |
          if ! git diff --quiet -- zk_stdlib/goldenfiles/examples; then
            echo "Files in zk_stdlib/goldenfiles/examples have changed"
            echo "Run "cargo test --release -- --ignored" locally and commit the changes"
            git diff -- zk_stdlib/goldenfiles/examples
            exit 1
          else
            echo "No changes in goldenfiles/examples"
          fi

  test-proofs:
    if: github.event.pull_request.draft == false
    name: Test proofs
    runs-on: ubuntu-latest
    steps:
      - name: Install libfontconfig1-dev
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-proofs
          args: --release

  test-aggregation:
    if: github.event.pull_request.draft == false
    name: Test Aggregation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-aggregation
          args: --release --all-features

  test-zkir:
    if: github.event.pull_request.draft == false
    name: Test ZKIR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/cargo-test
        with:
          package: midnight-zkir
          args: --release --all-features

  # ---------------------------------------------------------------------
  # Solidity verifier generator (halo2_solidity_verifier).
  #
  # These three jobs are the per-PR gate. The heavy IVC proof benches and
  # the release bytecode size/hash checks live in
  # `.github/workflows/solidity_verifier_bench.yml`, which runs on pushes to
  # `main`, on a weekly schedule, and on demand.
  #
  # Every job needs the pinned solc from
  # `proofs/solidity-verifier/scripts/install_pinned_solc.sh`; the EVM jobs
  # additionally need the Filecoin SRS that the rest of this workflow already
  # caches at `zk_stdlib/examples/assets/bls_filecoin_2p19`, which is where
  # the crate's `srs_dir()` looks by default.
  # ---------------------------------------------------------------------
  test-solidity-verifier:
    if: github.event.pull_request.draft == false
    name: Test Solidity verifier
    runs-on: ubuntu-latest

    env:
      SOLC_INSTALL_DIR: ${{ github.workspace }}/.solc

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Codegen/layout tests compile Solidity; the heavy proof/EVM cases
      # self-skip because HALO2_SOLIDITY_RUN_EVM_TESTS is unset here.
      #
      # Two suites run unconditionally in this job (audit finding F1 — the
      # env-gated suites silently never running was the finding):
      #   * the quotient frame differential
      #     (`quotient_frame_differential_*`, gated on the pinned solc
      #     alone), which certifies the compiled production evaluator
      #     against the expression oracle for every shape-corpus case; and
      #   * the tier-1 shape-corpus certification (`shape_corpus_*`), which
      #     needs no solc at all.
      # Beware the cargo-test trap: a name filter that matches zero tests
      # exits 0, so job health must never rest on a filtered invocation.
      # Proving-tier corpus tests follow the `pbt_` naming convention and
      # run in the release EVM job below.
      - name: Install pinned solc
        run: |
          echo "SOLC=$(proofs/solidity-verifier/scripts/install_pinned_solc.sh "$SOLC_INSTALL_DIR" | tail -1)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/cargo-test
        with:
          package: halo2_solidity_verifier
          args: --all-features --all-targets -- --nocapture

  # Feature-matrix tier-1 job (audit gap G4): `truncated-challenges`,
  # `outer-fewer-point-sets`, and `outer-single-h-commitment` each change the
  # proof layout, transcript shape, and quotient read windows, but every other
  # job tests the single `--all-features` point. Each combo below runs the
  # full tier-1 lib suite -- including the solc-gated quotient frame
  # differential and (where `rust-verifier-trace` is present) the
  # `trace_differential_smoke_fixed_shapes` native differential -- so every
  # protocol-affecting feature combination gets semantic per-PR coverage.
  #
  # The plain `evm` combo is UNCUTTABLE: `rust-verifier-trace` transitively
  # forces `truncated-challenges`, so this row is the only place the
  # non-truncated transcript schedule is ever semantically tested.
  test-solidity-verifier-features:
    if: github.event.pull_request.draft == false
    name: Test Solidity verifier feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "evm"
          - "evm,truncated-challenges,rust-verifier-trace"
          - "evm,outer-fewer-point-sets,truncated-challenges,rust-verifier-trace"
          - "evm,outer-single-h-commitment,truncated-challenges,rust-verifier-trace"
          - "evm,outer-fewer-point-sets,outer-single-h-commitment,truncated-challenges,rust-verifier-trace"

    env:
      SOLC_INSTALL_DIR: ${{ github.workspace }}/.solc

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pinned solc
        run: |
          echo "SOLC=$(proofs/solidity-verifier/scripts/install_pinned_solc.sh "$SOLC_INSTALL_DIR" | tail -1)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/cargo-test
        with:
          package: halo2_solidity_verifier
          args: --no-default-features --features ${{ matrix.features }} --lib -- --nocapture

  test-solidity-verifier-evm:
    if: github.event.pull_request.draft == false
    needs: download-srs
    name: Test Solidity verifier real EVM
    runs-on: ubuntu-latest

    env:
      SOLC_INSTALL_DIR: ${{ github.workspace }}/.solc
      HALO2_SOLIDITY_RUN_EVM_TESTS: 1
      # Deeper frame sampling for the release-profile quotient differentials;
      # the per-PR debug job keeps the default of 3 frames per case.
      HALO2_SOLIDITY_QUOTIENT_FRAMES: "16"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Restore SRS from cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - name: Install pinned solc
        run: |
          echo "SOLC=$(proofs/solidity-verifier/scripts/install_pinned_solc.sh "$SOLC_INSTALL_DIR" | tail -1)" >> "$GITHUB_ENV"

      - name: 'Install rust-toolchain.toml'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "ci"

      # Adversarial property tests over real compiled bytecode: structured
      # proof/VK/calldata mutation suites, the full shape-corpus
      # prove+deploy e2e (`pbt_supported_shape_circuit_fuzz_e2e`), the
      # random-shape quotient frame differential
      # (`pbt_quotient_frame_differential_random_shapes`), and the
      # transcript differential fuzzer. The `pbt_` literal is the naming
      # convention for env-gated corpus tests; ONLY tests carrying that
      # prefix run here — the non-`pbt_` adversarial suites (non-canonical
      # scalar/G1 rejection, EIP-170 runtime size, the memoryguard overlap
      # check) are env-gated but not matched by this filter and currently
      # run in no job (audit item F1/P0.1 in
      # proofs/solidity-verifier/docs/plans/REDESIGN_PROPOSALS_2026-08.md).
      # Beware the cargo-test trap: a filter matching zero tests exits 0, so
      # renaming a `pbt_` test silently drops it from this job.
      - name: Real EVM property tests
        run: cargo test -p halo2_solidity_verifier --release --all-features pbt_ -- --nocapture

      # End-to-end: real proof -> render -> solc -> Prague revm verification.
      - name: Poseidon fixture
        run: |
          cargo test -p halo2_solidity_verifier --release \
            --features evm,truncated-challenges --test poseidon_fixture -- --nocapture

  test-solidity-verifier-trace:
    if: github.event.pull_request.draft == false
    needs: download-srs
    name: Test Solidity verifier trace equivalence
    runs-on: ubuntu-latest

    env:
      SOLC_INSTALL_DIR: ${{ github.workspace }}/.solc
      HALO2_SOLIDITY_RUN_EVM_TESTS: 1

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Restore SRS from cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          path: zk_stdlib/examples/assets/bls_filecoin_2p19
          key: fixed-srs-cache

      - name: Install pinned solc
        run: |
          echo "SOLC=$(proofs/solidity-verifier/scripts/install_pinned_solc.sh "$SOLC_INSTALL_DIR" | tail -1)" >> "$GITHUB_ENV"

      - name: 'Install rust-toolchain.toml'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "ci"

      # Per-identity differential between the native Midfall verifier and the
      # generated Solidity verifier. This is the only check that compares
      # quotient VM semantics against the Rust verifier end to end.
      - name: Poseidon native/Solidity trace equivalence
        run: |
          cargo test -p halo2_solidity_verifier --release \
            --features evm,truncated-challenges,rust-verifier-trace,solidity-trace \
            --lib native_midfall_verifier_trace_matches_solidity_trace -- --nocapture

  doc-links:
    if: github.event.pull_request.draft == false
    name: Intra-doc links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: 'Install rust-toolchain.toml'
        run: rustup toolchain install
      - name: cargo fetch
        run: cargo fetch

      # Ensure intra-documentation links all resolve correctly
      # Requires #![deny(intra_doc_link_resolution_failure)] in crates.
      - name: Check intra-doc links
        run: cargo doc --workspace --document-private-items --no-deps

  fmt:
    if: github.event.pull_request.draft == false
    name: Rustfmt
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@nightly
      - run: rustup component add rustfmt --toolchain nightly
      - run: cargo +nightly fmt --all -- --check

  clippy:
    if: github.event.pull_request.draft == false
    name: Clippy
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: 'Install rust-toolchain.toml'
        run: rustup toolchain install

      # font required for benchmarking charts generation
      - name: Install libfontconfig1-dev
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Run Clippy
        if: always()
        run: cargo clippy --all-targets --all-features -- -Dwarnings

      - name: Run Clippy on `aggregation`
        if: always()
        run: cargo clippy -p midnight-aggregation --all-targets --all-features -- -Dwarnings

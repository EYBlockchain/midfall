# Phase 1 exit criteria for the formal project (plan Section 3).
name: formal

on:
  pull_request:
    paths: ['formal/**', '.github/workflows/formal.yml']
  push:
    branches: [main]
    paths: ['formal/**', '.github/workflows/formal.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
      - name: lake build
        run: lake build
      - name: Phase 1 gates (hash, sorry register, native_decide, KATs, axioms)
        run: bash scripts/checks.sh

[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = []
evm_version = "prague"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["*"]
fs_permissions = [{ access = "read-write", path = "./fixtures"}]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
